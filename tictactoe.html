    // ╔════════════════════════════════════════════════════════╗
    // ║              TIC-TAC-TOE GAME                          ║
    // ╚════════════════════════════════════════════════════════╝

    (function initTTT() {
        const WINNING_COMBOS = [
            [0, 1, 2], [3, 4, 5], [6, 7, 8], // rows
            [0, 3, 6], [1, 4, 7], [2, 5, 8], // cols
            [0, 4, 8], [2, 4, 6]              // diagonals
        ];

        let board = Array(9).fill(null);
        let currentPlayer = 'X';
        let gameOver = false;
        let winningCombo = null;
        let scoreX = 0;
        let scoreO = 0;
        let scoreDraw = 0;
        let boardLocked = false;

        const boardEl = document.getElementById('board-ttt');
        const resultBanner = document.getElementById('result-ttt');
        const restartBtn = document.getElementById('restart-ttt');
        const labelX = document.getElementById('labelX-ttt');
        const labelO = document.getElementById('labelO-ttt');
        const scoreXEl = document.getElementById('scoreX-ttt');
        const scoreOEl = document.getElementById('scoreO-ttt');
        const scoreDrawEl = document.getElementById('scoreDraw-ttt');

        function createBoard() {
            boardEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.dataset.index = i;
                cell.addEventListener('click', () => handleClick(i, cell));
                boardEl.appendChild(cell);
            }
        }

        function getCellEl(index) {
            return boardEl.querySelector(`[data-index="${index}"]`);
        }

        function updateTurnUI() {
            if (OnlineState.mode === 'online') {
                // In online mode, highlight based on myTurn
                const isMyTurn = OnlineState.myTurn && !gameOver;
                const myIsX = OnlineState.mySide === 'X';
                labelX.classList.toggle('active-x', isMyTurn && myIsX);
                labelO.classList.toggle('active-o', isMyTurn && !myIsX);
                if (gameOver || !OnlineState.myTurn) {
                    if (!isMyTurn || gameOver) {
                        labelX.classList.remove('active-x');
                        labelO.classList.remove('active-o');
                    }
                }
                // Show "你的回合" or "对手回合"
                if (gameOver) {
                    labelX.classList.remove('active-x');
                    labelO.classList.remove('active-o');
                }
                return;
            }

            labelX.classList.toggle('active-x', currentPlayer === 'X' && !gameOver);
            labelO.classList.toggle('active-o', currentPlayer === 'O' && !gameOver);
            if (gameOver) {
                labelX.classList.remove('active-x');
                labelO.classList.remove('active-o');
            }
        }

        function updateScoreUI() {
            scoreXEl.textContent = scoreX;
            scoreOEl.textContent = scoreO;
            scoreDrawEl.textContent = scoreDraw;
        }

        function checkWin() {
            for (const combo of WINNING_COMBOS) {
                const [a, b, c] = combo;
                if (board[a] && board[a] === board[b] && board[a] === board[c]) {
                    return combo;
                }
            }
            return null;
        }

        function isBoardFull() {
            return board.every(cell => cell !== null);
        }

        function highlightWin(combo) {
            combo.forEach(index => {
                const el = getCellEl(index);
                if (el) el.classList.add('win');
            });
        }

        function clearHighlights() {
            boardEl.querySelectorAll('.cell.win').forEach(el => el.classList.remove('win'));
        }

        function handleClick(index, cellEl) {
            if (gameOver) return;
            if (board[index] !== null) return;
            if (boardLocked) return;

            // Online mode: send move to server
            if (OnlineState.mode === 'online') {
                if (!OnlineState.myTurn) return;
                if (!OnlineState.connected) {
                    alert('与服务器断开连接');
                    return;
                }
                // Apply locally first, then send
                const myPiece = OnlineState.mySide;
                board[index] = myPiece;
                cellEl.textContent = myPiece;
                cellEl.classList.add('taken', myPiece === 'X' ? 'x-mark' : 'o-mark');
                cellEl.classList.add('pop');
                cellEl.addEventListener('animationend', () => cellEl.classList.remove('pop'), { once: true });

                OnlineState.myTurn = false;
                setBoardLocked('tictactoe', true);
                updateTurnUI();
                OnlineManager.sendMove('tictactoe', { index: index });

                // Check if I won locally
                winningCombo = checkWin();
                if (winningCombo) {
                    gameOver = true;
                    highlightWin(winningCombo);
                    resultBanner.innerHTML = '<span class="emoji">&#127942;</span> 你赢了！';
                    resultBanner.className = 'result-banner ' + (myPiece === 'X' ? 'win-x' : 'win-o');
                    if (myPiece === 'X') scoreX++; else scoreO++;
                    updateScoreUI();
                } else if (isBoardFull()) {
                    gameOver = true;
                    resultBanner.innerHTML = '<span class="emoji">&#129309;</span> 平局！';
                    resultBanner.className = 'result-banner draw';
                    scoreDraw++;
                    updateScoreUI();
                }
                return;
            }

            // Local mode
            board[index] = currentPlayer;
            cellEl.textContent = currentPlayer;
            cellEl.classList.add('taken', currentPlayer === 'X' ? 'x-mark' : 'o-mark');
            cellEl.classList.add('pop');
            cellEl.addEventListener('animationend', () => cellEl.classList.remove('pop'), { once: true });

            winningCombo = checkWin();

            if (winningCombo) {
                gameOver = true;
                highlightWin(winningCombo);
                resultBanner.innerHTML = `<span class="emoji">&#127942;</span> Player ${currentPlayer} wins!`;
                resultBanner.className = 'result-banner ' + (currentPlayer === 'X' ? 'win-x' : 'win-o');

                if (currentPlayer === 'X') scoreX++;
                else scoreO++;
                updateScoreUI();
                updateTurnUI();
                return;
            }

            if (isBoardFull()) {
                gameOver = true;
                resultBanner.innerHTML = `<span class="emoji">&#129309;</span> It's a draw!`;
                resultBanner.className = 'result-banner draw';
                scoreDraw++;
                updateScoreUI();
                updateTurnUI();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnUI();
            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';
        }

        // ── Online API ──
        function applyRemoteMove(position) {
            // Derive opponent's piece from my side
            const opponentPiece = OnlineState.mySide === 'X' ? 'O' : 'X';
            const index = position.index;
            board[index] = opponentPiece;
            const cellEl = getCellEl(index);
            if (cellEl) {
                cellEl.textContent = opponentPiece;
                cellEl.classList.add('taken', opponentPiece === 'X' ? 'x-mark' : 'o-mark');
                cellEl.classList.add('pop');
                cellEl.addEventListener('animationend', () => cellEl.classList.remove('pop'), { once: true });
            }

            updateTurnUI();
        }

        function checkWinAfterRemote() {
            // Check if the opponent's move ended the game
            winningCombo = checkWin();
            if (winningCombo) {
                gameOver = true;
                highlightWin(winningCombo);
                const opponentPiece = OnlineState.mySide === 'X' ? 'O' : 'X';
                if (opponentPiece !== OnlineState.mySide) {
                    resultBanner.innerHTML = '<span class="emoji">&#128546;</span> 你输了！';
                    resultBanner.className = 'result-banner ' + (OnlineState.mySide === 'X' ? 'win-o' : 'win-x');
                    if (OnlineState.mySide === 'X') scoreO++; else scoreX++;
                }
                updateScoreUI();
            } else if (isBoardFull()) {
                gameOver = true;
                resultBanner.innerHTML = '<span class="emoji">&#129309;</span> 平局！';
                resultBanner.className = 'result-banner draw';
                scoreDraw++;
                updateScoreUI();
            }
        }

        function lockBoard() { boardLocked = true; }
        function unlockBoard() { boardLocked = false; }

        function restartOnline() {
            board = Array(9).fill(null);
            currentPlayer = 'X';
            gameOver = false;
            winningCombo = null;
            boardLocked = false;

            boardEl.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x-mark', 'o-mark', 'pop', 'win');
            });

            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';

            OnlineState.myTurn = (OnlineState.mySide === 'X');
            setBoardLocked('tictactoe', !OnlineState.myTurn);
            updateTurnUI();
        }

        function restart() {
            if (OnlineState.mode === 'online') {
                OnlineManager.sendRestart();
                restartOnline();
                return;
            }

            board = Array(9).fill(null);
            currentPlayer = 'X';
            gameOver = false;
            winningCombo = null;
            boardLocked = false;

            boardEl.querySelectorAll('.cell').forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('taken', 'x-mark', 'o-mark', 'pop', 'win');
            });

            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';

            currentPlayer = 'X';
            updateTurnUI();
        }

        // Export controller
        gameControllers.tictactoe = {
            restart,
            restartOnline,
            applyRemoteMove,
            checkWinAfterRemote,
            lockBoard,
            unlockBoard
        };

        createBoard();
        updateTurnUI();
        updateScoreUI();
        restartBtn.addEventListener('click', restart);
    })();

    // ╔════════════════════════════════════════════════════════╗
    // ║                GOMOKU GAME                             ║
    // ╚════════════════════════════════════════════════════════╝

    (function initGomoku() {
        const SIZE = 15;

        let board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
        let currentPlayer = 'X';   // X = Black, goes first
        let gameOver = false;
        let winningCells = [];
        let movesCount = 0;
        let scoreX = 0;
        let scoreO = 0;
        let scoreDraw = 0;
        let boardLocked = false;

        const boardEl = document.getElementById('board-gmk');
        const resultBanner = document.getElementById('result-gmk');
        const restartBtn = document.getElementById('restart-gmk');
        const labelX = document.getElementById('labelX-gmk');
        const labelO = document.getElementById('labelO-gmk');
        const scoreXEl = document.getElementById('scoreX-gmk');
        const scoreOEl = document.getElementById('scoreO-gmk');
        const scoreDrawEl = document.getElementById('scoreDraw-gmk');

        // ── Build 15x15 board ──
        function createBoard() {
            boardEl.innerHTML = '';
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    cell.addEventListener('click', () => handleClick(r, c, cell));
                    boardEl.appendChild(cell);
                }
            }
        }

        function getCellEl(row, col) {
            return boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        function updateTurnUI() {
            if (OnlineState.mode === 'online') {
                const isMyTurn = OnlineState.myTurn && !gameOver;
                const myIsX = OnlineState.mySide === 'X';
                labelX.classList.toggle('active-x', isMyTurn && myIsX);
                labelO.classList.toggle('active-o', isMyTurn && !myIsX);
                if (gameOver) {
                    labelX.classList.remove('active-x');
                    labelO.classList.remove('active-o');
                }
                return;
            }

            labelX.classList.toggle('active-x', currentPlayer === 'X' && !gameOver);
            labelO.classList.toggle('active-o', currentPlayer === 'O' && !gameOver);
            if (gameOver) {
                labelX.classList.remove('active-x');
                labelO.classList.remove('active-o');
            }
        }

        function updateScoreUI() {
            scoreXEl.textContent = scoreX;
            scoreOEl.textContent = scoreO;
            scoreDrawEl.textContent = scoreDraw;
        }

        // ── Place a stone on the board (shared by local and remote) ──
        function placeStone(row, col, player) {
            board[row][col] = player;
            movesCount++;
            const cellEl = getCellEl(row, col);
            if (!cellEl) return;
            const stone = document.createElement('div');
            stone.classList.add('gomoku-stone');
            stone.classList.add(player === 'X' ? 'black-stone' : 'white-stone');
            cellEl.appendChild(stone);
            cellEl.classList.add('taken', 'pop');
            cellEl.addEventListener('animationend', () => cellEl.classList.remove('pop'), { once: true });
        }

        // ── Check 5 in a row from last placed stone ──
        function checkWin(row, col, player) {
            const directions = [
                [0, 1],   // horizontal
                [1, 0],   // vertical
                [1, 1],   // diagonal
                [1, -1]   // diagonal
            ];

            for (const [dr, dc] of directions) {
                const cells = [[row, col]];

                for (let i = 1; i < 5; i++) {
                    const r = row + dr * i;
                    const c = col + dc * i;
                    if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) {
                        cells.push([r, c]);
                    } else break;
                }

                for (let i = 1; i < 5; i++) {
                    const r = row - dr * i;
                    const c = col - dc * i;
                    if (r >= 0 && r < SIZE && c >= 0 && c < SIZE && board[r][c] === player) {
                        cells.unshift([r, c]);
                    } else break;
                }

                if (cells.length >= 5) return cells;
            }

            return null;
        }

        function highlightWin(cells) {
            cells.forEach(([r, c]) => {
                const el = getCellEl(r, c);
                if (el) el.classList.add('win');
            });
        }

        function clearHighlights() {
            boardEl.querySelectorAll('.cell.win').forEach(el => el.classList.remove('win'));
        }

        // ── Handle click ──
        function handleClick(row, col, cellEl) {
            if (gameOver) return;
            if (board[row][col] !== null) return;
            if (boardLocked) return;

            if (OnlineState.mode === 'online') {
                if (!OnlineState.myTurn) return;
                if (!OnlineState.connected) {
                    alert('与服务器断开连接');
                    return;
                }
                const myPiece = OnlineState.mySide;
                placeStone(row, col, myPiece);
                OnlineState.myTurn = false;
                setBoardLocked('gomoku', true);
                updateTurnUI();
                OnlineManager.sendMove('gomoku', { row: row, col: col });

                // Check if I won locally
                winningCells = checkWin(row, col, myPiece);
                if (winningCells) {
                    gameOver = true;
                    highlightWin(winningCells);
                    resultBanner.innerHTML = '<span class="emoji">&#127942;</span> 你赢了！';
                    resultBanner.className = 'result-banner ' + (myPiece === 'X' ? 'win-x' : 'win-o');
                    if (myPiece === 'X') scoreX++; else scoreO++;
                    updateScoreUI();
                } else if (movesCount >= SIZE * SIZE) {
                    gameOver = true;
                    resultBanner.innerHTML = '<span class="emoji">&#129309;</span> 平局！';
                    resultBanner.className = 'result-banner draw';
                    scoreDraw++;
                    updateScoreUI();
                }
                return;
            }

            // Local mode
            placeStone(row, col, currentPlayer);

            winningCells = checkWin(row, col, currentPlayer);

            if (winningCells) {
                gameOver = true;
                highlightWin(winningCells);
                const playerName = currentPlayer === 'X' ? 'Black' : 'White';
                resultBanner.innerHTML = `<span class="emoji">&#127942;</span> ${playerName} wins!`;
                resultBanner.className = 'result-banner ' + (currentPlayer === 'X' ? 'win-x' : 'win-o');

                if (currentPlayer === 'X') scoreX++;
                else scoreO++;
                updateScoreUI();
                updateTurnUI();
                return;
            }

            if (movesCount >= SIZE * SIZE) {
                gameOver = true;
                resultBanner.innerHTML = `<span class="emoji">&#129309;</span> It's a draw!`;
                resultBanner.className = 'result-banner draw';
                scoreDraw++;
                updateScoreUI();
                updateTurnUI();
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnUI();
            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';
        }

        // ── Online API ──
        function applyRemoteMove(position) {
            const opponentPiece = OnlineState.mySide === 'X' ? 'O' : 'X';
            const { row, col } = position;
            placeStone(row, col, opponentPiece);
            updateTurnUI();
        }

        function checkWinAfterRemote() {
            const opponentPiece = OnlineState.mySide === 'X' ? 'O' : 'X';
            // Find the last-placed stone position for win check
            // (we'll check all positions of opponentPiece)
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === opponentPiece) {
                        const wc = checkWin(r, c, opponentPiece);
                        if (wc) {
                            gameOver = true;
                            winningCells = wc;
                            highlightWin(wc);
                            resultBanner.innerHTML = '<span class="emoji">&#128546;</span> 你输了！';
                            resultBanner.className = 'result-banner ' + (OnlineState.mySide === 'X' ? 'win-o' : 'win-x');
                            if (OnlineState.mySide === 'X') scoreO++; else scoreX++;
                            updateScoreUI();
                            return;
                        }
                    }
                }
            }
            if (movesCount >= SIZE * SIZE) {
                gameOver = true;
                resultBanner.innerHTML = '<span class="emoji">&#129309;</span> 平局！';
                resultBanner.className = 'result-banner draw';
                scoreDraw++;
                updateScoreUI();
            }
        }

        function lockBoard() { boardLocked = true; }
        function unlockBoard() { boardLocked = false; }

        function restartOnline() {
            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
            currentPlayer = 'X';
            gameOver = false;
            winningCells = [];
            movesCount = 0;
            boardLocked = false;

            boardEl.querySelectorAll('.cell').forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('taken', 'pop', 'win');
            });

            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';

            OnlineState.myTurn = (OnlineState.mySide === 'X');
            setBoardLocked('gomoku', !OnlineState.myTurn);
            updateTurnUI();
        }

        function restart() {
            if (OnlineState.mode === 'online') {
                OnlineManager.sendRestart();
                restartOnline();
                return;
            }

            board = Array(SIZE).fill(null).map(() => Array(SIZE).fill(null));
            currentPlayer = 'X';
            gameOver = false;
            winningCells = [];
            movesCount = 0;
            boardLocked = false;

            boardEl.querySelectorAll('.cell').forEach(cell => {
                cell.innerHTML = '';
                cell.classList.remove('taken', 'pop', 'win');
            });

            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';

            currentPlayer = 'X';
            updateTurnUI();
        }

        // Export controller
        gameControllers.gomoku = {
            restart,
            restartOnline,
            applyRemoteMove,
            checkWinAfterRemote,
            lockBoard,
            unlockBoard
        };

        createBoard();
        updateTurnUI();
        updateScoreUI();
        restartBtn.addEventListener('click', restart);
    })();

    // ╔════════════════════════════════════════════════════════╗
    // ║            CHINESE CHESS GAME                          ║
    // ╚════════════════════════════════════════════════════════╝

    (function initChess() {
        const ROWS = 10;
        const COLS = 9;

        const PIECE_CHARS = {
            red:   { king: '帅', advisor: '仕', elephant: '相', horse: '馬', rook: '車', cannon: '炮', pawn: '兵' },
            black: { king: '将', advisor: '士', elephant: '象', horse: '馬', rook: '車', cannon: '砲', pawn: '卒' }
        };

        let board = [];
        let currentSide = 'red';
        let selectedRow = -1;
        let selectedCol = -1;
        let validMoves = [];
        let gameOver = false;
        let winner = null;
        let scoreRed = 0;
        let scoreBlack = 0;
        let scoreDraw = 0;
        let lastMoveFrom = null;
        let lastMoveTo = null;
        let boardLocked = false;

        const boardEl = document.getElementById('board-chs');
        const resultBanner = document.getElementById('result-chs');
        const restartBtn = document.getElementById('restart-chs');
        const labelRed = document.getElementById('labelRed-chs');
        const labelBlack = document.getElementById('labelBlack-chs');
        const scoreRedEl = document.getElementById('scoreRed-chs');
        const scoreBlackEl = document.getElementById('scoreBlack-chs');
        const scoreDrawEl = document.getElementById('scoreDraw-chs');

        // ── Palace bounds ──
        function inPalace(row, col, side) {
            if (side === 'black') return row >= 0 && row <= 2 && col >= 3 && col <= 5;
            return row >= 7 && row <= 9 && col >= 3 && col <= 5;
        }

        function inOwnHalf(row, side) {
            if (side === 'black') return row >= 0 && row <= 4;
            return row >= 5 && row <= 9;
        }

        function inBounds(r, c) {
            return r >= 0 && r < ROWS && c >= 0 && c < COLS;
        }

        // ── Find king ──
        function findKing(side) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.type === 'king' && p.side === side) return { row: r, col: c };
                }
            }
            return null;
        }

        // ── Flying general check ──
        function kingsAreFacing(boardRef) {
            const redKing = findKingInBoard(boardRef, 'red');
            const blackKing = findKingInBoard(boardRef, 'black');
            if (!redKing || !blackKing) return false;
            if (redKing.col !== blackKing.col) return false;
            const minR = Math.min(redKing.row, blackKing.row);
            const maxR = Math.max(redKing.row, blackKing.row);
            for (let r = minR + 1; r < maxR; r++) {
                if (boardRef[r][redKing.col] !== null) return false;
            }
            return true;
        }

        function findKingInBoard(boardRef, side) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = boardRef[r][c];
                    if (p && p.type === 'king' && p.side === side) return { row: r, col: c };
                }
            }
            return null;
        }

        // ── Is a square attacked by `attackerSide` on boardRef? ──
        function isSquareAttacked(boardRef, row, col, attackerSide) {
            const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
            for (const [dr, dc] of dirs) {
                let r = row + dr, c = col + dc;
                while (inBounds(r, c)) {
                    const p = boardRef[r][c];
                    if (p) {
                        if (p.side === attackerSide && p.type === 'rook') return true;
                        break;
                    }
                    r += dr; c += dc;
                }
            }

            for (const [dr, dc] of dirs) {
                let r = row + dr, c = col + dc;
                let screenFound = false;
                while (inBounds(r, c)) {
                    const p = boardRef[r][c];
                    if (!screenFound) {
                        if (p) { screenFound = true; }
                    } else {
                        if (p) {
                            if (p.side === attackerSide && p.type === 'cannon') return true;
                            break;
                        }
                    }
                    r += dr; c += dc;
                }
            }

            const horseMoves = getRawHorseMoves(row, col, boardRef);
            for (const [mr, mc] of horseMoves) {
                const p = boardRef[mr][mc];
                if (p && p.side === attackerSide && p.type === 'horse') return true;
            }

            const pawnDirs = attackerSide === 'red'
                ? [[-1,0],[0,-1],[0,1]]
                : [[1,0],[0,-1],[0,1]];
            for (const [dr, dc] of pawnDirs) {
                const pr = row - dr, pc = col - dc;
                if (!inBounds(pr, pc)) continue;
                const pp = boardRef[pr][pc];
                if (!pp || pp.side !== attackerSide || pp.type !== 'pawn') continue;
                if (dc === 0) return true;
                const crossedRiver = attackerSide === 'red' ? pr <= 4 : pr >= 5;
                if (crossedRiver) return true;
            }

            return false;
        }

        function getRawHorseMoves(r, c, boardRef) {
            const moves = [];
            const legBlocks = [
                { dr: -1, dc:  0, moves: [[-2,-1],[-2,1]] },
                { dr:  1, dc:  0, moves: [[ 2,-1],[ 2,1]] },
                { dr:  0, dc: -1, moves: [[-1,-2],[ 1,-2]] },
                { dr:  0, dc:  1, moves: [[-1, 2],[ 1, 2]] }
            ];
            for (const leg of legBlocks) {
                const lr = r + leg.dr, lc = c + leg.dc;
                if (!inBounds(lr, lc) || boardRef[lr][lc] !== null) continue;
                for (const [mdr, mdc] of leg.moves) {
                    const mr = r + mdr, mc = c + mdc;
                    if (inBounds(mr, mc)) moves.push([mr, mc]);
                }
            }
            return moves;
        }

        function getRawMoves(row, col, boardRef) {
            const piece = boardRef[row][col];
            if (!piece) return [];
            const { type, side } = piece;
            const moves = [];

            switch (type) {
                case 'king': {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (const [dr, dc] of dirs) {
                        const nr = row + dr, nc = col + dc;
                        if (!inBounds(nr, nc)) continue;
                        if (!inPalace(nr, nc, side)) continue;
                        const target = boardRef[nr][nc];
                        if (target && target.side === side) continue;
                        moves.push([nr, nc]);
                    }
                    break;
                }
                case 'advisor': {
                    const dirs = [[-1,-1],[-1,1],[1,-1],[1,1]];
                    for (const [dr, dc] of dirs) {
                        const nr = row + dr, nc = col + dc;
                        if (!inBounds(nr, nc)) continue;
                        if (!inPalace(nr, nc, side)) continue;
                        const target = boardRef[nr][nc];
                        if (target && target.side === side) continue;
                        moves.push([nr, nc]);
                    }
                    break;
                }
                case 'elephant': {
                    const elephantMoves = [
                        { dr: -2, dc: -2, eyeDr: -1, eyeDc: -1 },
                        { dr: -2, dc:  2, eyeDr: -1, eyeDc:  1 },
                        { dr:  2, dc: -2, eyeDr:  1, eyeDc: -1 },
                        { dr:  2, dc:  2, eyeDr:  1, eyeDc:  1 }
                    ];
                    for (const m of elephantMoves) {
                        const nr = row + m.dr, nc = col + m.dc;
                        if (!inBounds(nr, nc)) continue;
                        if (!inOwnHalf(nr, side)) continue;
                        const eyeR = row + m.eyeDr, eyeC = col + m.eyeDc;
                        if (boardRef[eyeR][eyeC] !== null) continue;
                        const target = boardRef[nr][nc];
                        if (target && target.side === side) continue;
                        moves.push([nr, nc]);
                    }
                    break;
                }
                case 'horse': {
                    const raw = getRawHorseMoves(row, col, boardRef);
                    for (const [nr, nc] of raw) {
                        const target = boardRef[nr][nc];
                        if (target && target.side === side) continue;
                        moves.push([nr, nc]);
                    }
                    break;
                }
                case 'rook': {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (const [dr, dc] of dirs) {
                        let nr = row + dr, nc = col + dc;
                        while (inBounds(nr, nc)) {
                            const target = boardRef[nr][nc];
                            if (target) {
                                if (target.side !== side) moves.push([nr, nc]);
                                break;
                            }
                            moves.push([nr, nc]);
                            nr += dr; nc += dc;
                        }
                    }
                    break;
                }
                case 'cannon': {
                    const dirs = [[-1,0],[1,0],[0,-1],[0,1]];
                    for (const [dr, dc] of dirs) {
                        let nr = row + dr, nc = col + dc;
                        while (inBounds(nr, nc)) {
                            if (boardRef[nr][nc]) break;
                            moves.push([nr, nc]);
                            nr += dr; nc += dc;
                        }
                        if (!inBounds(nr, nc)) continue;
                        nr += dr; nc += dc;
                        while (inBounds(nr, nc)) {
                            const target = boardRef[nr][nc];
                            if (target) {
                                if (target.side !== side) moves.push([nr, nc]);
                                break;
                            }
                            nr += dr; nc += dc;
                        }
                    }
                    break;
                }
                case 'pawn': {
                    if (side === 'red') {
                        const fwdR = row - 1;
                        if (inBounds(fwdR, col)) {
                            const t = boardRef[fwdR][col];
                            if (!t || t.side !== side) moves.push([fwdR, col]);
                        }
                        if (row <= 4) {
                            for (const dc of [-1, 1]) {
                                const nc = col + dc;
                                if (inBounds(row, nc)) {
                                    const t = boardRef[row][nc];
                                    if (!t || t.side !== side) moves.push([row, nc]);
                                }
                            }
                        }
                    } else {
                        const fwdR = row + 1;
                        if (inBounds(fwdR, col)) {
                            const t = boardRef[fwdR][col];
                            if (!t || t.side !== side) moves.push([fwdR, col]);
                        }
                        if (row >= 5) {
                            for (const dc of [-1, 1]) {
                                const nc = col + dc;
                                if (inBounds(row, nc)) {
                                    const t = boardRef[row][nc];
                                    if (!t || t.side !== side) moves.push([row, nc]);
                                }
                            }
                        }
                    }
                    break;
                }
            }
            return moves;
        }

        function simulateMove(boardRef, fromR, fromC, toR, toC) {
            const newBoard = boardRef.map(row => row.slice());
            newBoard[toR][toC] = newBoard[fromR][fromC];
            newBoard[fromR][fromC] = null;
            return newBoard;
        }

        function isInCheck(boardRef, side) {
            const king = findKingInBoard(boardRef, side);
            if (!king) return true;
            const opponent = side === 'red' ? 'black' : 'red';
            if (isSquareAttacked(boardRef, king.row, king.col, opponent)) return true;
            if (kingsAreFacing(boardRef)) return true;
            return false;
        }

        function getLegalMoves(row, col) {
            const piece = board[row][col];
            if (!piece) return [];
            const rawMoves = getRawMoves(row, col, board);
            const legal = [];
            for (const [nr, nc] of rawMoves) {
                const sim = simulateMove(board, row, col, nr, nc);
                if (!isInCheck(sim, piece.side)) {
                    legal.push([nr, nc]);
                }
            }
            return legal;
        }

        function hasLegalMoves(side) {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const p = board[r][c];
                    if (p && p.side === side) {
                        if (getLegalMoves(r, c).length > 0) return true;
                    }
                }
            }
            return false;
        }

        function initBoard() {
            board = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));

            const blackBack = ['rook','horse','elephant','advisor','king','advisor','elephant','horse','rook'];
            for (let c = 0; c < 9; c++) board[0][c] = { type: blackBack[c], side: 'black' };
            board[2][1] = { type: 'cannon', side: 'black' };
            board[2][7] = { type: 'cannon', side: 'black' };
            for (let c = 0; c < 9; c += 2) board[3][c] = { type: 'pawn', side: 'black' };

            const redBack = ['rook','horse','elephant','advisor','king','advisor','elephant','horse','rook'];
            for (let c = 0; c < 9; c++) board[9][c] = { type: redBack[c], side: 'red' };
            board[7][1] = { type: 'cannon', side: 'red' };
            board[7][7] = { type: 'cannon', side: 'red' };
            for (let c = 0; c < 9; c += 2) board[6][c] = { type: 'pawn', side: 'red' };

            currentSide = 'red';
            selectedRow = -1;
            selectedCol = -1;
            validMoves = [];
            gameOver = false;
            winner = null;
            lastMoveFrom = null;
            lastMoveTo = null;
        }

        function getPalaceClass(row, col) {
            if (row === 0 && col === 3) return 'palace-tl';
            if (row === 0 && col === 5) return 'palace-tr';
            if (row === 2 && col === 3) return 'palace-bl';
            if (row === 2 && col === 5) return 'palace-br';
            if (row === 7 && col === 3) return 'palace-tl';
            if (row === 7 && col === 5) return 'palace-tr';
            if (row === 9 && col === 3) return 'palace-bl';
            if (row === 9 && col === 5) return 'palace-br';
            return '';
        }

        function renderBoard() {
            boardEl.innerHTML = '';

            for (let dr = 0; dr < ROWS; dr++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('chess-cell');
                    cell.classList.add('col-' + c);
                    cell.classList.add('row-' + dr);

                    const visualRow = dr < 5 ? dr + 1 : dr + 2;
                    cell.style.gridRow = visualRow;
                    cell.style.gridColumn = c + 1;

                    cell.dataset.row = dr;
                    cell.dataset.col = c;

                    const pc = getPalaceClass(dr, c);
                    if (pc) cell.classList.add(pc);

                    const piece = board[dr][c];
                    if (piece) {
                        const pieceEl = document.createElement('div');
                        pieceEl.classList.add('chess-piece');
                        pieceEl.classList.add(piece.side === 'red' ? 'red-piece' : 'black-piece');
                        pieceEl.textContent = PIECE_CHARS[piece.side][piece.type];
                        cell.appendChild(pieceEl);
                    }

                    if (dr === selectedRow && c === selectedCol) {
                        cell.classList.add('selected');
                    }

                    if (lastMoveFrom && dr === lastMoveFrom.row && c === lastMoveFrom.col) {
                        cell.classList.add('last-move');
                    }
                    if (lastMoveTo && dr === lastMoveTo.row && c === lastMoveTo.col) {
                        cell.classList.add('last-move');
                    }

                    const vm = validMoves.find(m => m[0] === dr && m[1] === c);
                    if (vm) {
                        cell.classList.add('valid-move');
                        if (board[dr][c] && board[dr][c].side !== currentSide) {
                            cell.classList.add('capture-move');
                        }
                    }

                    cell.addEventListener('click', () => handleChessClick(dr, c));
                    boardEl.appendChild(cell);
                }
            }

            const river = document.createElement('div');
            river.classList.add('chess-river');
            river.style.gridRow = '6';
            river.style.gridColumn = '1 / -1';
            river.innerHTML = '<span>楚 河</span><span>汉 界</span>';
            boardEl.appendChild(river);
        }

        function getCellEl(row, col) {
            return boardEl.querySelector(`[data-row="${row}"][data-col="${col}"]`);
        }

        function updateTurnUI() {
            if (OnlineState.mode === 'online') {
                const isMyTurn = OnlineState.myTurn && !gameOver;
                const myIsRed = OnlineState.mySide === 'red';
                labelRed.classList.toggle('active-red', isMyTurn && myIsRed);
                labelBlack.classList.toggle('active-black', isMyTurn && !myIsRed);
                if (gameOver) {
                    labelRed.classList.remove('active-red');
                    labelBlack.classList.remove('active-black');
                }
                return;
            }

            labelRed.classList.toggle('active-red', currentSide === 'red' && !gameOver);
            labelBlack.classList.toggle('active-black', currentSide === 'black' && !gameOver);
            if (gameOver) {
                labelRed.classList.remove('active-red');
                labelBlack.classList.remove('active-black');
            }
        }

        function updateScoreUI() {
            scoreRedEl.textContent = scoreRed;
            scoreBlackEl.textContent = scoreBlack;
            scoreDrawEl.textContent = scoreDraw;
        }

        function checkGameEnd() {
            const inCheck = isInCheck(board, currentSide);
            const hasMoves = hasLegalMoves(currentSide);

            if (!hasMoves) {
                gameOver = true;
                if (inCheck) {
                    const prevSide = currentSide === 'red' ? 'black' : 'red';
                    winner = prevSide;
                    const winnerName = prevSide === 'red' ? 'Red (红方)' : 'Black (黑方)';
                    resultBanner.innerHTML = `<span class="emoji">&#127942;</span> Checkmate! ${winnerName} wins!`;
                    resultBanner.className = 'result-banner ' + (prevSide === 'red' ? 'win-x' : 'win-o');
                    if (prevSide === 'red') scoreRed++;
                    else scoreBlack++;
                } else {
                    resultBanner.innerHTML = `<span class="emoji">&#129309;</span> Stalemate — Draw!`;
                    resultBanner.className = 'result-banner draw';
                    scoreDraw++;
                }
                updateScoreUI();
                updateTurnUI();
                return true;
            }

            if (inCheck) {
                const checkedName = currentSide === 'red' ? 'Red' : 'Black';
                resultBanner.innerHTML = `<span>&#9888;</span> ${checkedName} is in check!`;
                resultBanner.className = 'result-banner';
            } else {
                resultBanner.textContent = '';
                resultBanner.className = 'result-banner';
            }
            return false;
        }

        function handleChessClick(row, col) {
            if (gameOver) return;
            if (boardLocked) return;

            // Online mode: block interaction when not my turn
            if (OnlineState.mode === 'online') {
                if (!OnlineState.myTurn) return;
                if (!OnlineState.connected) {
                    alert('与服务器断开连接');
                    return;
                }
            }

            const piece = board[row][col];

            if (selectedRow >= 0 && selectedCol >= 0) {
                const vmIdx = validMoves.findIndex(m => m[0] === row && m[1] === col);
                if (vmIdx >= 0) {
                    // Execute move
                    const fromRow = selectedRow;
                    const fromCol = selectedCol;
                    board[row][col] = board[selectedRow][selectedCol];
                    board[selectedRow][selectedCol] = null;

                    lastMoveFrom = { row: selectedRow, col: selectedCol };
                    lastMoveTo = { row, col };

                    selectedRow = -1;
                    selectedCol = -1;
                    validMoves = [];

                    if (OnlineState.mode === 'online') {
                        // In online mode, send move and switch sides (server handles result)
                        const movedSide = (currentSide === 'red' ? 'black' : 'red');
                        currentSide = currentSide === 'red' ? 'black' : 'red';
                        renderBoard();
                        updateTurnUI();
                        OnlineState.myTurn = false;
                        setBoardLocked('chess', true);
                        OnlineManager.sendMove('chess', {
                            fromRow: fromRow, fromCol: fromCol,
                            toRow: row, toCol: col
                        });
                        // Check game end locally
                        checkGameEnd();
                        return;
                    }

                    // Local mode
                    currentSide = currentSide === 'red' ? 'black' : 'red';
                    renderBoard();
                    updateTurnUI();
                    checkGameEnd();
                    return;
                }

                if (piece && piece.side === currentSide) {
                    selectedRow = row;
                    selectedCol = col;
                    validMoves = getLegalMoves(row, col);
                    renderBoard();
                    return;
                }

                selectedRow = -1;
                selectedCol = -1;
                validMoves = [];
                renderBoard();
                return;
            }

            if (piece && piece.side === currentSide) {
                selectedRow = row;
                selectedCol = col;
                validMoves = getLegalMoves(row, col);
                renderBoard();
            }
        }

        // ── Online API ──
        function applyRemoteMove(position) {
            const { fromRow, fromCol, toRow, toCol } = position;

            board[toRow][toCol] = board[fromRow][fromCol];
            board[fromRow][fromCol] = null;

            lastMoveFrom = { row: fromRow, col: fromCol };
            lastMoveTo = { row: toRow, col: toCol };

            selectedRow = -1;
            selectedCol = -1;
            validMoves = [];

            currentSide = currentSide === 'red' ? 'black' : 'red';

            renderBoard();
            updateTurnUI();
        }

        function checkWinAfterRemote() {
            checkGameEnd();
        }

        function lockBoard() { boardLocked = true; }
        function unlockBoard() { boardLocked = false; }

        function restartOnline() {
            initBoard();
            boardLocked = false;
            selectedRow = -1;
            selectedCol = -1;
            validMoves = [];
            gameOver = false;
            winner = null;
            lastMoveFrom = null;
            lastMoveTo = null;

            renderBoard();

            OnlineState.myTurn = (OnlineState.mySide === 'red');
            currentSide = 'red';
            setBoardLocked('chess', !OnlineState.myTurn);

            updateTurnUI();
            updateScoreUI();
            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';
        }

        function restart() {
            if (OnlineState.mode === 'online') {
                OnlineManager.sendRestart();
                restartOnline();
                return;
            }

            initBoard();
            boardLocked = false;
            selectedRow = -1;
            selectedCol = -1;
            validMoves = [];
            gameOver = false;
            winner = null;
            lastMoveFrom = null;
            lastMoveTo = null;

            renderBoard();

            currentSide = 'red';

            updateTurnUI();
            updateScoreUI();
            resultBanner.textContent = '';
            resultBanner.className = 'result-banner';
        }

        // Export controller
        gameControllers.chess = {
            restart,
            restartOnline,
            applyRemoteMove,
            checkWinAfterRemote,
            lockBoard,
            unlockBoard
        };

        initBoard();
        renderBoard();
        updateTurnUI();
        updateScoreUI();
        restartBtn.addEventListener('click', restart);
    })();

    // ╔════════════════════════════════════════════════════════╗
    // ║            LOBBY EVENT WIRING                          ║
    // ╚════════════════════════════════════════════════════════╝

    const btnCreateRoom = document.getElementById('btn-create-room');
    const btnJoinRoom = document.getElementById('btn-join-room');
    const btnLeaveRoom = document.getElementById('btn-leave-room');
    const btnReady = document.getElementById('btn-ready');
    const roomIdInput = document.getElementById('room-id-input');
    const createGameSelect = document.getElementById('create-game-select');

    // Enable/disable join button based on room ID input
    roomIdInput.addEventListener('input', () => {
        btnJoinRoom.disabled = roomIdInput.value.trim() === '';
    });

    btnCreateRoom.addEventListener('click', () => {
        const game = createGameSelect.value;
        OnlineManager.createRoom(game);
    });

    btnJoinRoom.addEventListener('click', () => {
        const roomId = roomIdInput.value.trim();
        if (!roomId) return;
        OnlineManager.joinRoom(roomId);
    });

    btnReady.addEventListener('click', () => {
        btnReady.disabled = true;
        btnReady.textContent = '已准备';
        document.getElementById('ready-status-text').textContent = '已准备，等待对手确认...';
        OnlineManager.sendReady();
    });

    btnLeaveRoom.addEventListener('click', () => {
        OnlineManager.leaveRoom();
        // Reset all game boards
        if (gameControllers.tictactoe) gameControllers.tictactoe.restartOnline();
        if (gameControllers.gomoku) gameControllers.gomoku.restartOnline();
        if (gameControllers.chess) gameControllers.chess.restartOnline();
    });

})();
</script>
